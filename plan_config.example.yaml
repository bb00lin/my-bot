# C27 Project Plan 同步設定（GitHub Secret PLAN_CONFIG_YAML 的來源；更新後請重設 secret）
# atlassian / notify 共用 CONFIG_YAML；這裡只放計畫專用設定（全部在 plan: 底下，避免誤用 Register 的頁面）
plan:
  sheet:
    # 建立後填入 Google Sheet ID；空白時以 title 搜尋（試算表需分享給 service account）
    sheet_id: ""
    title: "C27_Project_Plan"
    share_with:
      - "bob.lin@qsitw.com"
  confluence:
    space_key: "projectmod"
    space_id: "1409028"
    parent_page_id: "14057511"   # C27_project_module_wifi7_QCC2072
    page_title: "C27 Project Plan"
    page_id: ""                  # 第一次建立後會記在 Sheet 的 _sync_state；也可手動填
    show_discussion: true        # Discussion / Comments 欄顯示在 Confluence（不進 Jira）
  jira:
    project_key: "PMWC"
    epic_issue_type: "大型工作"
    task_issue_type: "任務"
    start_date_field: "customfield_10015"
    due_date_field: "duedate"
    label: "c27-plan"
    default_assignee_account_id: "712020:a50a0ee0-1928-47a7-a135-a07c21c233ce"   # shannonchang
    on_removed: "close"          # close（轉完成 + label plan-removed）或 delete
    max_removals: 10             # 單次超過此數量的刪除需加 --allow-mass-removal
  notify:
    email_to: "bob.lin@qsitw.com"
    email_cc: "shannon.chang@qsitw.com,vic.wu@qsitw.com"
    email_on_github: true

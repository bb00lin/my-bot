name: DEBUG WeeklyReport verify (temporary)

# 一次性驗證用（手動觸發）：唯讀，不修改任何 Confluence 內容、不輸出任何金鑰。
# 驗證完成後請刪除本 workflow 與 scripts/probe_weekly_verify.py。

on:
  workflow_dispatch:
    inputs:
      page_id:
        description: 'WeeklyReport page id'
        required: false
        default: '214925313'
      issue_key:
        description: 'Issue key to dump block order for'
        required: false
        default: 'PBY-11'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run verify
        env:
          CONF_URL: ${{ secrets.CONF_URL }}
          CONF_USER: ${{ secrets.CONF_USER }}
          CONF_PASS: ${{ secrets.CONF_PASS }}
          PROBE_PAGE_ID: ${{ github.event.inputs.page_id }}
          PROBE_ISSUE_KEY: ${{ github.event.inputs.issue_key }}
          PYTHONIOENCODING: 'utf-8'
        run: python scripts/probe_weekly_verify.py

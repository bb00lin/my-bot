name: Run STM32 GPIO Planner

on:
  workflow_dispatch:  # 允許手動執行
  push:
    paths:
      - 'stm32_dashboard.py'  # 當程式碼變更時執行
      - 'STM32MP133CAFx.xml'

jobs:
  run-planner:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # 設定超時，避免卡死

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread oauth2client

      - name: Check Environment Files
        env:
          HAS_SECRET: ${{ secrets.GOOGLE_SHEETS_JSON != '' }}
        run: |
          echo "📂 檢查檔案完整性..."
          ls -l
          
          if [ ! -f "STM32MP133CAFx.xml" ]; then
            echo "❌ 錯誤: 找不到 XML 檔案！請確認 'STM32MP133CAFx.xml' 已上傳。"
            exit 1
          fi
          
          if [ ! -f "stm32_dashboard.py" ]; then
            echo "❌ 錯誤: 找不到 Python 主程式！請確認 'stm32_dashboard.py' 已上傳。"
            exit 1
          fi

          if [ "$HAS_SECRET" != "true" ]; then
            echo "❌ 錯誤: GitHub Secret 'GOOGLE_SHEETS_JSON' 未設定！"
            exit 1
          fi
          
          echo "✅ 環境檢查通過，準備執行..."

      - name: Run Planner Script
        env:
          GOOGLE_SHEETS_JSON: ${{ secrets.GOOGLE_SHEETS_JSON }}
        run: python stm32_dashboard.py
